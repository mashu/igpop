name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The library without the command-line feature, as the web app uses it.
      - run: cargo clippy --no-default-features --lib -- -D warnings
      # Unit tests only: nothing in the test suite touches the network.
      - run: cargo test

  web:
    # The browser build must compile; it is published by pages.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - run: cargo clippy -p igpop-web --target wasm32-unknown-unknown -- -D warnings
      - run: node --check web/static/app.js && node --check web/static/worker.js
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build web --target web --release --no-typescript --out-dir pkg
      - name: Assemble the app
        run: |
          mkdir -p app/pkg
          cp web/static/* app/
          cp web/pkg/*.js web/pkg/*.wasm app/pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: app
          retention-days: 7
