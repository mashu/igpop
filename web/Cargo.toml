[package]
name = "igpop-web"
version = "0.12.1"
edition = "2021"
description = "igpop compiled to WebAssembly for the browser app"
license = "MIT"
repository = "https://github.com/mashu/igpop"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
igpop = { path = "..", default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["XmlHttpRequest", "XmlHttpRequestResponseType"] }

# The wasm-opt that wasm-pack downloads cannot read the module current Rust
# produces (reference types); the release profile already optimises.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
